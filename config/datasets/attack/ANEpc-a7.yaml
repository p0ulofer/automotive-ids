# =============================================================================
# config/datasets/attack/ANEpc-a7.yaml -- NE periodic (\\*) variante (a) MITM
# =============================================================================
# Mesma calibracao validada de ANEpc-a1 (duration 23s, tamper 90%, svc 0x1235);
# varia SO o alvo de payload/valores do tamper (Tabela II: "8 variantes de
# payload/valores de ataque"). Contagens esperadas identicas as de a1.
#
# Alvo (Tabela III / interpretacao (A)): 1732 anomalia / 4077 total = 42.5%.

dataset: ANEpc-a7
base: normal_nepc
variant: "NE(*) (a) MITM - tamper-notify 90% (plausible, steering signal)"
seed: 42
duration_s: 23
attacker_args: >-
  --tamper-notify 0.90 --tamper-svc 0x1235
  --tamper-kind plausible --tamper-signal steering
